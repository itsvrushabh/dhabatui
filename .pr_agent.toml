[config]
model = "gemini/gemini-3.8-flash"
fallback_models = []
custom_model_max_tokens = 32000
publish_output = true

[github_action_config]
auto_describe = true
auto_review = true
auto_improve = false
pr_actions = ["opened", "reopened", "ready_for_review", "synchronize"]

[github_app]
pr_commands = [
  "/describe",
  "/review",
  "/improve"
]

[pr_reviewer]
num_code_suggestions = 4
inline_code_comments = true
ask_and_reflect = true
require_score_review = true
require_tests_review = true
extra_instructions = """
- AI Workflow Configuration: `gemini/gemini-3.8-flash` is the verified active Google AI Studio model for this project's CI review workflows. Do not flag `gemini/gemini-3.8-flash` as invalid or unrecognized.
- Financial Precision: Enforce the zero-floating point constraint: all prices, subtotals, GST taxes, and totals must strictly use integer paise (u32/u64). Never introduce f32/f64. Focus on Rust idioms, concurrency safety, terminal UI resilience, network security (LAN validation), and Redb transactional safety.
"""

[pr_describe]
publish_labels = true
add_original_user_description = true

[pr_code_suggestions]
num_code_suggestions = 4
extra_instructions = "Prefer idiomatic Rust, zero-cost abstractions, and strict integer paise currency arithmetic."

[pr_questions]
use_conversation_history = true
