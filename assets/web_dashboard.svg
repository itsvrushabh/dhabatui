<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .browser-bar { fill: #151b28; }
      .url-bar { fill: #0f1420; stroke: #263248; stroke-width: 1.5; rx: 6px; }
      .card-bg { fill: #151b28; stroke: #263248; stroke-width: 1.5; rx: 8px; }
      .card-active { fill: #151f33; stroke: #38bdf8; stroke-width: 1.5; rx: 8px; }
      .badge-vacant { fill: #334155; rx: 4px; }
      .badge-ordering { fill: #f59e0b; rx: 4px; }
      .badge-served { fill: #06b6d4; rx: 4px; }
      .badge-billed { fill: #10b981; rx: 4px; }
      .stat-box { fill: #131a29; stroke: #1e293b; stroke-width: 1.5; rx: 8px; }
      .text-title { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: bold; }
      .text-sub { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; }
      .text-metric { fill: #38bdf8; font-family: monospace; font-size: 20px; font-weight: bold; }
      .text-metric-green { fill: #10b981; font-family: monospace; font-size: 20px; font-weight: bold; }
      .text-item { fill: #e2e8f0; font-family: monospace; font-size: 12px; }
      .text-price { fill: #10b981; font-family: monospace; font-size: 12px; font-weight: bold; }
      .text-custom { fill: #f43f5e; font-family: monospace; font-size: 12px; font-weight: bold; }
      .text-dim { fill: #64748b; font-family: monospace; font-size: 11px; }
    </style>
  </defs>

  <!-- Browser Window Frame -->
  <rect width="1100" height="680" rx="12" class="bg"/>
  <rect width="1100" height="42" rx="12" class="browser-bar"/>
  <circle cx="24" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="21" r="6" fill="#27c93f"/>

  <!-- URL Bar -->
  <rect x="110" y="8" width="880" height="26" class="url-bar"/>
