  <circle cx="970" cy="21" r="4" fill="#10b981"/>
  <text x="960" y="25" fill="#10b981" font-family="monospace" font-size="11" text-anchor="end">Auto-refresh 2s</text>

  <!-- Header Banner -->
  <text x="30" y="76" class="text-title" font-size="20">🍲 DhabaTUI — Live Dining Tables Dashboard</text>
