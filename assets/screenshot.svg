  <rect x="545" y="368" width="535" height="160" class="border-box-inactive"/>
  <text x="560" y="388" class="text-title-dim">Bill &amp; Tax Summary (5% GST)</text>

  <text x="565" y="415" class="text-dim">Total Items: 11 (5 lines)</text>
  <text x="880" y="415" class="text-dim">Subtotal:</text>
  <text x="990" y="415" class="text-name" font-weight="bold">₹610.00</text>

  <text x="880" y="445" class="text-dim">CGST (2.5%):</text>
  <text x="1005" y="445" fill="#54a0ff" font-family="monospace" font-size="13">₹15.25</text>

  <text x="880" y="475" class="text-dim">SGST (2.5%):</text>
  <text x="1005" y="475" fill="#54a0ff" font-family="monospace" font-size="13">₹15.25</text>

  <line x1="880" y1="488" x2="1060" y2="488" stroke="#4a5568" stroke-width="1"/>

  <text x="840" y="512" class="text-code" font-size="14">GRAND TOTAL:</text>
  <rect x="965" y="495" width="100" height="24" class="total-badge"/>
  <text x="980" y="512" class="total-text">₹640.50</text>

  <!-- 5. Toast Status Notification -->
  <rect x="20" y="538" width="1060" height="28" rx="4" class="toast-bg"/>
  <text x="35" y="557" class="text-toast">✓ Bill #101 settled (₹640.50)! Saved to receipt.txt and dhabatui.redb</text>

  <!-- 6. Footer Keybindings Helper -->
  <text x="550" y="595" text-anchor="middle">
    <tspan class="key-tag">Tab</tspan><tspan class="key-desc">:Pane | </tspan>
    <tspan class="key-tag">Enter</tspan><tspan class="key-desc">:Add | </tspan>
    <tspan class="key-tag">+/-</tspan><tspan class="key-desc">:Qty | </tspan>
    <tspan class="key-tag">e</tspan><tspan class="key-desc">:Edit Price | </tspan>
    <tspan class="key-tag">m</tspan><tspan class="key-desc">:Making Chg | </tspan>
    <tspan class="key-tag">d</tspan><tspan class="key-desc">:Del | </tspan>
    <tspan class="key-tag">c</tspan><tspan class="key-desc">:Clear | </tspan>
    <tspan class="key-tag">p</tspan><tspan class="key-desc">:Settle &amp; Print | </tspan>
    <tspan class="key-tag">q</tspan><tspan class="key-desc">:Quit</tspan>
  </text>
</svg>
