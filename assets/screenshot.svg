  <text x="95" y="208" class="text-name">Paneer Butter Masala</text>
  <text x="330" y="208" class="text-cat-mains">Mains</text>
  <text x="460" y="208" class="text-price">₹210.00</text>

  <text x="45" y="238" class="text-code">[201]</text>
  <text x="95" y="238" class="text-name">Tandoori Roti</text>
  <text x="330" y="238" class="text-cat-breads">Breads</text>
  <text x="460" y="238" class="text-price">₹15.00</text>

  <text x="45" y="268" class="text-code">[202]</text>
  <text x="95" y="268" class="text-name">Butter Naan</text>
  <text x="330" y="268" class="text-cat-breads">Breads</text>
  <text x="460" y="268" class="text-price">₹45.00</text>

  <text x="45" y="298" class="text-code">[401]</text>
  <text x="95" y="298" class="text-name">Mutton Making (1/2 kg)</text>
  <text x="330" y="298" class="text-cat-making">Making Chg</text>
  <text x="460" y="298" class="text-price">₹180.00</text>

  <text x="45" y="328" class="text-code">[402]</text>
  <text x="95" y="328" class="text-name">Mutton Making (1 kg)</text>
  <text x="330" y="328" class="text-cat-making">Making Chg</text>
  <text x="460" y="328" class="text-price">₹320.00</text>

  <text x="45" y="358" class="text-code">[403]</text>
  <text x="95" y="358" class="text-name">Chicken Making (1/2 kg)</text>
  <text x="330" y="358" class="text-cat-making">Making Chg</text>
  <text x="460" y="358" class="text-price">₹130.00</text>

  <text x="45" y="388" class="text-code">[501]</text>
  <text x="95" y="388" class="text-name">Sweet Lassi</text>
  <text x="330" y="388" class="text-cat-breads">Beverages</text>
  <text x="460" y="388" class="text-price">₹60.00</text>

  <text x="45" y="418" class="text-code">[502]</text>
  <text x="95" y="418" class="text-name">Chaas / Buttermilk</text>
  <text x="330" y="418" class="text-cat-breads">Beverages</text>
  <text x="460" y="418" class="text-price">₹30.00</text>

  <!-- 3. Right Pane: Current Order Table -->
  <rect x="545" y="98" width="535" height="260" class="border-box"/>
  <text x="560" y="118" class="text-title">[2] Current Order ▶ (+/- Qty | e: Edit Price | d: Del)</text>

  <!-- Table Header -->
  <rect x="552" y="128" width="521" height="22" fill="#141923"/>
  <text x="560" y="144" class="text-code">Code</text>
  <text x="615" y="144" class="text-code">Item Name</text>
  <text x="830" y="144" class="text-code">Qty</text>
  <text x="890" y="144" class="text-code">Unit Price</text>
  <text x="1000" y="144" class="text-code">Total</text>

  <!-- Order Rows -->
  <text x="560" y="174" class="text-dim">[CUST]</text>
  <text x="615" y="174" class="text-custom">* 1/2kg Mutton Masala (Making)</text>
  <text x="835" y="174" class="text-qty">1</text>
  <text x="900" y="174" class="text-name">₹180.00</text>
  <text x="1000" y="174" class="text-price">₹180.00</text>

  <text x="560" y="204" class="text-dim">[CUST]</text>
  <text x="615" y="204" class="text-custom">* 1/2kg Mutton Fry (Making)</text>
  <text x="835" y="204" class="text-qty">1</text>
  <text x="900" y="204" class="text-name">₹160.00</text>
  <text x="1000" y="204" class="text-price">₹160.00</text>

  <text x="560" y="234" class="text-dim">[201]</text>
  <text x="615" y="234" class="text-name">Tandoori Roti</text>
  <text x="835" y="234" class="text-qty">6</text>
  <text x="900" y="234" class="text-name">₹15.00</text>
  <text x="1000" y="234" class="text-price">₹90.00</text>

  <text x="560" y="264" class="text-dim">[302]</text>
  <text x="615" y="264" class="text-name">Jeera Rice</text>
  <text x="835" y="264" class="text-qty">1</text>
  <text x="900" y="264" class="text-name">₹120.00</text>
  <text x="1000" y="264" class="text-price">₹120.00</text>

  <text x="560" y="294" class="text-dim">[502]</text>
  <text x="615" y="294" class="text-name">Chaas / Buttermilk</text>
  <text x="835" y="294" class="text-qty">2</text>
  <text x="900" y="294" class="text-name">₹30.00</text>
  <text x="1000" y="294" class="text-price">₹60.00</text>

