<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f141c; }
      .window-bar { fill: #1a202c; }
      .border-box { fill: none; stroke: #00d2d3; stroke-width: 1.5; rx: 6px; }
      .border-box-inactive { fill: none; stroke: #4a5568; stroke-width: 1.5; rx: 6px; }
      .header-bg { fill: #f39c12; }
      .header-text { fill: #000000; font-family: monospace; font-size: 14px; font-weight: bold; }
      .header-sub { fill: #00d2d3; font-family: monospace; font-size: 13px; font-weight: 600; }
      .header-lan { fill: #2ecc71; font-family: monospace; font-size: 12px; font-weight: bold; }
      .text-title { fill: #00d2d3; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-title-dim { fill: #a0aec0; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-code { fill: #f1c40f; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-name { fill: #ffffff; font-family: monospace; font-size: 13px; }
      .text-custom { fill: #ff7675; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-cat-mains { fill: #ff6b6b; font-family: monospace; font-size: 12px; }
      .text-cat-breads { fill: #feca57; font-family: monospace; font-size: 12px; }
      .text-cat-making { fill: #fd79a8; font-family: monospace; font-size: 12px; }
      .text-price { fill: #1dd1a1; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-qty { fill: #54a0ff; font-family: monospace; font-size: 13px; font-weight: bold; }
      .text-dim { fill: #718096; font-family: monospace; font-size: 12px; }
      .text-toast { fill: #000000; font-family: monospace; font-size: 12px; font-weight: bold; }
      .toast-bg { fill: #2ecc71; rx: 4px; }
      .key-tag { fill: #f1c40f; font-family: monospace; font-size: 12px; font-weight: bold; }
      .key-desc { fill: #cbd5e0; font-family: monospace; font-size: 12px; }
      .row-highlight { fill: #1e3a5a; rx: 4px; }
      .total-badge { fill: #2ecc71; rx: 4px; }
      .total-text { fill: #000000; font-family: monospace; font-size: 15px; font-weight: bold; }
      .active-table-badge { fill: #00d2d3; rx: 4px; }
    </style>
  </defs>

  <!-- Window Frame -->
  <rect width="1100" height="660" rx="10" class="bg"/>
  <rect width="1100" height="34" rx="10" class="window-bar"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="38" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="56" cy="17" r="6" fill="#27c93f"/>
  <text x="550" y="22" fill="#a0aec0" font-family="monospace" font-size="12" text-anchor="middle">dhabatui - Terminal POS &amp; Billing System (redb ACID Engine)</text>

  <!-- 1. Header Banner -->
  <rect x="20" y="46" width="1060" height="40" class="border-box-inactive" stroke="#f1c40f"/>
  <rect x="25" y="51" width="125" height="30" rx="4" class="header-bg"/>
  <text x="35" y="71" class="header-text">🍲 DHABA TUI</text>
  <text x="165" y="71" class="header-sub">Smart POS &amp; Billing System</text>

  <!-- 2. Dining Tables Bar -->
  <rect x="20" y="94" width="1060" height="40" class="border-box-inactive" stroke="#4a5568"/>
  <text x="32" y="118" class="text-dim">Tables:</text>

  <!-- Table 1 (Active) -->
  <rect x="90" y="101" width="180" height="26" class="active-table-badge"/>
  <text x="96" y="118" fill="#000" font-family="monospace" font-size="12" font-weight="bold">▶ T1: ₹640.50 (Ord) ◀</text>

  <!-- Table 2..8 & Parcel -->
  <text x="285" y="118" class="text-dim">[T2]</text>
  <text x="330" y="118" class="text-dim">[T3]</text>
  <text x="375" y="118" class="text-dim">[T4]</text>
  <text x="420" y="118" class="text-dim">[T5]</text>
  <text x="465" y="118" class="text-dim">[T6]</text>
  <text x="510" y="118" class="text-dim">[T7]</text>
  <text x="555" y="118" class="text-dim">[T8]</text>
  <text x="600" y="118" class="text-dim">[Parcel]</text>
  <text x="750" y="118" fill="#a0aec0" font-family="monospace" font-size="11">(Press 't' to cycle, 's' to toggle status)</text>

  <!-- 3. Left Pane: Menu Catalog -->
  <rect x="20" y="142" width="515" height="420" class="border-box"/>
  <text x="35" y="162" class="text-title">[1] Menu Catalog ▶ (Enter: Add to Table | Digits: Code)</text>

  <!-- Menu Items List -->
  <rect x="26" y="174" width="503" height="26" class="row-highlight"/>
  <text x="35" y="192" class="text-code">▶ [101]</text>
  <text x="95" y="192" class="text-name">Dal Tadka</text>
  <text x="330" y="192" class="text-cat-mains">Mains</text>
  <text x="460" y="192" class="text-price">₹130.00</text>

  <text x="45" y="222" class="text-code">[102]</text>
  <text x="95" y="222" class="text-name">Dal Makhani</text>
  <text x="330" y="222" class="text-cat-mains">Mains</text>
  <text x="460" y="222" class="text-price">₹160.00</text>

  <text x="45" y="252" class="text-code">[103]</text>
  <text x="95" y="252" class="text-name">Paneer Butter Masala</text>
  <text x="330" y="252" class="text-cat-mains">Mains</text>
  <text x="460" y="252" class="text-price">₹210.00</text>

  <text x="45" y="282" class="text-code">[201]</text>
  <text x="95" y="282" class="text-name">Tandoori Roti</text>
  <text x="330" y="282" class="text-cat-breads">Breads</text>
  <text x="460" y="282" class="text-price">₹15.00</text>

  <text x="45" y="312" class="text-code">[202]</text>
  <text x="95" y="312" class="text-name">Butter Naan</text>
  <text x="330" y="312" class="text-cat-breads">Breads</text>
  <text x="460" y="312" class="text-price">₹45.00</text>

  <text x="45" y="342" class="text-code">[401]</text>
  <text x="95" y="342" class="text-name">Mutton Making (1/2 kg)</text>
  <text x="330" y="342" class="text-cat-making">Making Chg</text>
  <text x="460" y="342" class="text-price">₹180.00</text>

  <text x="45" y="372" class="text-code">[402]</text>
  <text x="95" y="372" class="text-name">Mutton Making (1 kg)</text>
  <text x="330" y="372" class="text-cat-making">Making Chg</text>
  <text x="460" y="372" class="text-price">₹320.00</text>

  <text x="45" y="402" class="text-code">[501]</text>
  <text x="95" y="402" class="text-name">Sweet Lassi</text>
  <text x="330" y="402" class="text-cat-breads">Beverages</text>
  <text x="460" y="402" class="text-price">₹60.00</text>

  <text x="45" y="432" class="text-code">[502]</text>
  <text x="95" y="432" class="text-name">Chaas / Buttermilk</text>
  <text x="330" y="432" class="text-cat-breads">Beverages</text>
  <text x="460" y="432" class="text-price">₹30.00</text>

  <!-- 4. Right Pane: Current Table Order Table -->
  <rect x="545" y="142" width="535" height="255" class="border-box"/>
  <text x="560" y="162" class="text-title">[2] Order: Table 1 [Ordering] ▶ (+/- Qty | e: Edit | d: Del)</text>

  <!-- Table Header -->
  <rect x="552" y="172" width="521" height="22" fill="#141923"/>
  <text x="560" y="188" class="text-code">Code</text>
  <text x="615" y="188" class="text-code">Item Name</text>
  <text x="830" y="188" class="text-code">Qty</text>
  <text x="890" y="188" class="text-code">Unit Price</text>
  <text x="1000" y="188" class="text-code">Total</text>

  <!-- Order Rows -->
  <text x="560" y="216" class="text-dim">[CUST]</text>
  <text x="615" y="216" class="text-custom">* 1/2kg Mutton Masala (Making)</text>
  <text x="835" y="216" class="text-qty">1</text>
  <text x="900" y="216" class="text-name">₹180.00</text>
  <text x="1000" y="216" class="text-price">₹180.00</text>

  <text x="560" y="244" class="text-dim">[CUST]</text>
  <text x="615" y="244" class="text-custom">* 1/2kg Mutton Fry (Making)</text>
  <text x="835" y="244" class="text-qty">1</text>
  <text x="900" y="244" class="text-name">₹160.00</text>
  <text x="1000" y="244" class="text-price">₹160.00</text>

  <text x="560" y="272" class="text-dim">[201]</text>
  <text x="615" y="272" class="text-name">Tandoori Roti</text>
  <text x="835" y="272" class="text-qty">6</text>
  <text x="900" y="272" class="text-name">₹15.00</text>
  <text x="1000" y="272" class="text-price">₹90.00</text>

  <text x="560" y="300" class="text-dim">[302]</text>
  <text x="615" y="300" class="text-name">Jeera Rice</text>
  <text x="835" y="300" class="text-qty">1</text>
  <text x="900" y="300" class="text-name">₹120.00</text>
  <text x="1000" y="300" class="text-price">₹120.00</text>

  <text x="560" y="328" class="text-dim">[502]</text>
  <text x="615" y="328" class="text-name">Chaas / Buttermilk</text>
  <text x="835" y="328" class="text-qty">2</text>
  <text x="900" y="328" class="text-name">₹30.00</text>
  <text x="1000" y="328" class="text-price">₹60.00</text>

  <!-- 5. Financials Summary Box -->
  <rect x="545" y="405" width="535" height="157" class="border-box-inactive"/>
  <text x="560" y="425" class="text-title-dim">Bill &amp; Tax (5% GST) - Table 1</text>

  <text x="565" y="450" class="text-dim">Total Items: 11 (5 lines)</text>
  <text x="880" y="450" class="text-dim">Subtotal:</text>
  <text x="990" y="450" class="text-name" font-weight="bold">₹610.00</text>

  <text x="880" y="478" class="text-dim">CGST (2.5%):</text>
  <text x="1005" y="478" fill="#54a0ff" font-family="monospace" font-size="13">₹15.25</text>

  <text x="880" y="506" class="text-dim">SGST (2.5%):</text>
  <text x="1005" y="506" fill="#54a0ff" font-family="monospace" font-size="13">₹15.25</text>

  <line x1="880" y1="518" x2="1060" y2="518" stroke="#4a5568" stroke-width="1"/>

  <text x="840" y="542" class="text-code" font-size="14">GRAND TOTAL:</text>
  <rect x="965" y="525" width="100" height="24" class="total-badge"/>
  <text x="980" y="542" class="total-text">₹640.50</text>

  <!-- 6. Toast Status Notification -->
  <rect x="20" y="570" width="1060" height="28" rx="4" class="toast-bg"/>
  <text x="35" y="589" class="text-toast">✓ Bill #101 settled for Table 1 (₹640.50)! Saved to receipt.txt and dhabatui.redb</text>

  <!-- 7. Footer Keybindings Helper -->
  <text x="550" y="628" text-anchor="middle">
    <tspan class="key-tag">t</tspan><tspan class="key-desc">:Table | </tspan>
    <tspan class="key-tag">s</tspan><tspan class="key-desc">:Status | </tspan>
    <tspan class="key-tag">Tab</tspan><tspan class="key-desc">:Pane | </tspan>
    <tspan class="key-tag">Enter</tspan><tspan class="key-desc">:Add | </tspan>
    <tspan class="key-tag">+/-</tspan><tspan class="key-desc">:Qty | </tspan>
    <tspan class="key-tag">e</tspan><tspan class="key-desc">:Edit Price | </tspan>
    <tspan class="key-tag">m</tspan><tspan class="key-desc">:Making Chg | </tspan>
    <tspan class="key-tag">p</tspan><tspan class="key-desc">:Settle | </tspan>
    <tspan class="key-tag">q</tspan><tspan class="key-desc">:Quit</tspan>
  </text>
</svg>
