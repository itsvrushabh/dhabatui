<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f141c; }
      .flow-box { fill: #1a2233; stroke: #2a3b5c; stroke-width: 1.5; rx: 8px; }
      .flow-box-accent { fill: #13273e; stroke: #00d2d3; stroke-width: 2; rx: 8px; }
      .badge-step { fill: #f59e0b; rx: 4px; }
      .text-step { fill: #000; font-family: monospace; font-size: 11px; font-weight: bold; }
      .text-title { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 15px; font-weight: bold; }
      .text-desc { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; }
      .text-hotkey { fill: #f59e0b; font-family: monospace; font-size: 12px; font-weight: bold; }
      .arrow { stroke: #00d2d3; stroke-width: 2.5; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1000" height="380" rx="10" class="bg"/>

  <text x="30" y="42" fill="#00d2d3" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold">⚡ Dhaba Cashier 4-Step Rapid Billing Workflow</text>
  <text x="30" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Zero-mouse, 100% keyboard-driven billing designed for high-turnover roadside dhabas and eateries.</text>

  <!-- Step 1: Select Dining Table -->
  <rect x="30" y="95" width="205" height="240" class="flow-box"/>
  <rect x="42" y="107" width="55" height="20" class="badge-step"/><text x="69" y="121" class="text-step" text-anchor="middle">STEP 1</text>
  <text x="42" y="152" class="text-title">Select Table</text>
  <text x="42" y="174" class="text-desc">Choose between tables</text>
  <text x="42" y="192" class="text-desc">T1..T8 or Parcel Takeaway.</text>
  <rect x="42" y="210" width="180" height="30" fill="#0b0f19" rx="4"/>
  <text x="50" y="230" class="text-hotkey">Press 't' / 'T'</text>
  <text x="42" y="264" class="text-desc">Cycle active status:</text>
  <text x="42" y="282" class="text-desc">Ordering ➔ Served ➔</text>
  <text x="42" y="300" class="text-desc">Billed ('s' cycles)</text>

  <!-- Arrow 1 -> 2 -->
  <path d="M 245 215 L 265 215 M 260 207 L 268 215 L 260 223" class="arrow"/>

  <!-- Step 2: Add Dishes / Quick Code -->
  <rect x="275" y="95" width="205" height="240" class="flow-box"/>
  <rect x="287" y="107" width="55" height="20" class="badge-step"/><text x="314" y="121" class="text-step" text-anchor="middle">STEP 2</text>
  <text x="287" y="152" class="text-title">Add Dishes</text>
  <text x="287" y="174" class="text-desc">Add catalog dishes or</text>
  <text x="287" y="192" class="text-desc">use memorized codes.</text>
  <rect x="287" y="210" width="180" height="30" fill="#0b0f19" rx="4"/>
  <text x="295" y="230" class="text-hotkey">Enter (Menu) or '101'</text>
  <text x="287" y="264" class="text-desc">Rapid code entry with</text>
  <text x="287" y="282" class="text-desc">automatic line item</text>
  <text x="287" y="300" class="text-desc">quantity aggregation.</text>

  <!-- Arrow 2 -> 3 -->
  <path d="M 490 215 L 510 215 M 505 207 L 513 215 L 505 223" class="arrow"/>

  <!-- Step 3: Custom Banwai & Price Alter -->
  <rect x="520" y="95" width="205" height="240" class="flow-box"/>
  <rect x="532" y="107" width="55" height="20" class="badge-step"/><text x="559" y="121" class="text-step" text-anchor="middle">STEP 3</text>
  <text x="532" y="152" class="text-title">Custom / Making</text>
  <text x="532" y="174" class="text-desc">Customer meat cooking</text>
  <text x="532" y="192" class="text-desc">charges &amp; bulk discounts.</text>
  <rect x="532" y="210" width="180" height="30" fill="#0b0f19" rx="4"/>
  <text x="540" y="230" class="text-hotkey">'m' (Making) / 'e' (Price)</text>
  <text x="532" y="264" class="text-desc">Half-kg mutton masala,</text>
  <text x="532" y="282" class="text-desc">fry charges, or verbal</text>
  <text x="532" y="300" class="text-desc">negotiated dish prices.</text>

  <!-- Arrow 3 -> 4 -->
  <path d="M 735 215 L 755 215 M 750 207 L 758 215 L 750 223" class="arrow"/>

  <!-- Step 4: Settle & Print Receipt -->
  <rect x="765" y="95" width="205" height="240" class="flow-box-accent"/>
  <rect x="777" y="107" width="55" height="20" fill="#10b981" rx="4"/><text x="804" y="121" fill="#000" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">STEP 4</text>
  <text x="777" y="152" class="text-title" fill="#00d2d3">Settle &amp; Save</text>
  <text x="777" y="174" class="text-desc">Atomic ACID commit</text>
  <text x="777" y="192" class="text-desc">and receipt saving.</text>
  <rect x="777" y="210" width="180" height="30" fill="#0b0f19" rx="4"/>
  <text x="785" y="230" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Press 'p' (Settle)</text>
  <text x="777" y="264" class="text-desc">Commits to redb,</text>
  <text x="777" y="282" class="text-desc">saves receipt.txt,</text>
  <text x="777" y="300" class="text-desc">and clears table cart.</text>
</svg>
