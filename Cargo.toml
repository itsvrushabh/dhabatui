[package]
name = "dhabatui"
version = "0.1.0"
edition = "2021"
authors = ["Dhaba POS Team"]
description = "Fast, keyboard-first Terminal POS and billing application for dhabas and casual eateries"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
redb = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3"

