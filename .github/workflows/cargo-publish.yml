name: Cargo Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate packaging without publishing to crates.io)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate package (dry-run)
        run: cargo publish --dry-run

      - name: Check Crates.io Token
        id: check_token
        run: |
          if [ -n "${{ secrets.CARGO_REGISTRY_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Missing Secret::CARGO_REGISTRY_TOKEN secret is not configured. Add CARGO_REGISTRY_TOKEN under GitHub repo Settings > Secrets and variables > Actions."
          fi

      - name: Publish to Crates.io
        if: steps.check_token.outputs.has_token == 'true' && inputs.dry_run != true
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          PKG_VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "Checking if dhabatui@${PKG_VERSION} is already published to crates.io..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/dhabatui/${PKG_VERSION}" || true)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "::warning title=Already Published::Crate dhabatui@${PKG_VERSION} already exists on crates.io. Skipping publish."
          else
            cargo publish --locked
          fi
