name: OpenCode Review

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  opencode_review:
    name: OpenCode PR Review
    if: |
      github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        (github.event.comment != null && (
          contains(github.event.comment.body, '/oc') ||
          contains(github.event.comment.body, '/opencode')
        ))
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Sign in to OpenCode
        id: signin
        continue-on-error: true
        env:
          AUDIENCE: https://opencode.ai/console
        run: |
          oidc=$(curl -sSf --oauth2-bearer "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          token=$(curl -sSf https://opencode.ai/console/auth/oauth/token \
            -d grant_type=urn:ietf:params:oauth:grant-type:token-exchange \
            -d subject_token_type=urn:ietf:params:oauth:token-type:jwt \
            -d client_id=sk_242642b3-b9a2-48cb-a5d5-b983a41fdb0f \
            -d subject_token="$oidc" | jq -r .access_token)
          echo "::add-mask::$token"
          echo "OPENCODE_API_KEY=$token" >> "$GITHUB_ENV"

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        continue-on-error: true
        env:
          OPENCODE_API_KEY: ${{ env.OPENCODE_API_KEY || secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: ${{ secrets.OPENCODE_MODEL || 'opencode/big-pickle' }}
          use_github_token: true
          prompt: ${{ github.event_name == 'pull_request' && 'Review this pull request for bugs, code quality, test coverage, and adherence to zero-float integer paise arithmetic.' || '' }}
