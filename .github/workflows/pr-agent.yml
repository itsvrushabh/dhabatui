name: PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr_agent_job:
    if: |
      github.event.sender.type != 'Bot' && (
        github.event_name == 'pull_request' ||
        (github.event.comment != null && (
          contains(github.event.comment.body, '/pr-agent') ||
          contains(github.event.comment.body, '/review') ||
          contains(github.event.comment.body, '/describe') ||
          contains(github.event.comment.body, '/improve')
        ))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      pull-requests: write

    name: Run PR Agent (/describe, /review, /improve)
    steps:
      - name: Check for AI API Key
        id: check_keys
        run: |
          if [ -n "${{ secrets.OPENAI_KEY }}" ] || [ -n "${{ secrets.OPENAI_API_KEY }}" ] || [ -n "${{ secrets.GEMINI_API_KEY }}" ] || [ -n "${{ secrets.GEMINI_KEY }}" ] || [ -n "${{ secrets.ANTHROPIC_KEY }}" ] || [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice ::No AI API key secret configured in repository settings. Set OPENAI_KEY, OPENAI_API_KEY, GEMINI_API_KEY, or ANTHROPIC_KEY in repo Settings > Secrets and variables > Actions to enable automated PR-Agent reviews."
          fi

      - name: PR Agent action step
        if: steps.check_keys.outputs.has_key == 'true'
        id: pragent
        continue-on-error: true
        uses: Codium-ai/pr-agent@main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY }}
          OPENAI.API_KEY: ${{ secrets.OPENAI_KEY || secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GEMINI_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY }}
          ANTHROPIC_KEY: ${{ secrets.ANTHROPIC_KEY || secrets.ANTHROPIC_API_KEY }}
          CONFIG.MODEL: ${{ secrets.PR_AGENT_MODEL || ((secrets.OPENAI_KEY != '' || secrets.OPENAI_API_KEY != '') && 'gpt-4o') || ((secrets.ANTHROPIC_KEY != '' || secrets.ANTHROPIC_API_KEY != '') && 'claude-3-5-sonnet-20241022') || 'gemini/gemini-3.8-flash' }}
          CONFIG.FALLBACK_MODELS: "[]"
          CONFIG.CUSTOM_MODEL_MAX_TOKENS: "32000"
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "false"
